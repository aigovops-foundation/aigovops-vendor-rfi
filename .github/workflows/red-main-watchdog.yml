name: red-main-watchdog

# Adopting the estate's shared red-main watchdog (one `uses:` line — the reusable workflow and
# its rationale live in the Library repo).
#
# Scheduled, not on push, because the failure it catches is DURATION: a main that has been red
# for days while everyone assumes it is green. Two estate repos were exactly that in July 2026.

on:
  schedule:
    - cron: "25 15 * * *"   # daily, staggered across the estate
  workflow_dispatch:

# The caller has to grant what the reusable workflow asks for (actions: read) or every run is a
# startup_failure with no job and no log. Same fix as the Library, Omni, Beacon and the camp.
permissions:
  contents: read
  actions: read

jobs:
  red-main:
    uses: aigovops-foundation/aigovops-library-june-ken-bob/.github/workflows/reusable-red-main-watchdog.yml@d402457658f626cbdb77ec6f7de08916e829e7d9 # main 2026-10-18
    with:
      max_red_hours: 48
